<!-- Apply CSS Styles to each paragraph using inline, internal and external styles -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 css types</title>
</head>
<body>

    <!-- Inline CSS -->
    <p style="background-color: lightblue; color: darkblue;">
        This is a paragraph with inline CSS.
    </p>


    <!-- Internal CSS -->
    <style>
        .internal-css {
            background-color: lightgreen;
            color: darkgreen;
        }
    </style>
    <p class="internal-css">
        This is a paragraph with internal CSS.
    </p>

    
    <!-- External CSS -->
    <p class="external-css">
        This is a paragraph with external CSS.
    </p>

    <link rel="stylesheet" href="/Practice-task-01/External.css">

</body>
</html>
