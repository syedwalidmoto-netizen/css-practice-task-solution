<!-- 02. Apply CSS styles to change the text color,alignment,font-size,font-family and font-style for different elements--> 

<!DOCTYPE html>
<html>
<head>
    <title>Styled Webpage</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
            font-size: 40px;
            font-family: Arial;
        }

        h3 {
            color: purple;
            text-align: left;
            font-size: 24px;
            font-family: Georgia;
        }

        p {
            color: green;
            text-align: justify;
            font-size: 18px;
            font-family: Verdana;
            font-style: italic;
        }

        ul {
            color: red;
            font-size: 20px;
            font-family: Courier New;
        }
    </style>

</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>This is my first paragraph with style.</p>
    <p>This is my second paragraph with style.</p>

    <h3>My Favorite Subjects: Web design & development </h3>

    <ul>
        <li>html</li>
        <li>css</li>
        <li>JavaScript</li>
        <li>Computer</li>
        <li>English</li>
    </ul>

</body>
</html>
