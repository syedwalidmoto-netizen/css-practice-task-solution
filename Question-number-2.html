<!--02. Apply CSS styles to set the display property to none,hidden,inline,block,and inline-block for specific elements -->


<!DOCTYPE html>
<html>
<head>
    <title>Display Property Example</title>

    <style>
        .none-box {
            display: none;
        }

        .hidden-box {
            visibility: hidden;
        }

        .inline-text {
            display: inline;
            background-color: rgb(41, 108, 110);
        }

        .block-box {
            display: block;
            background-color: lightblue;
            margin: 10px 0;
        }

        .inline-block-box {
            display: inline-block;
            width: 150px;
            height: 80px;
            background-color: lightgreen;
            margin: 20px;
            text-align: center;
            
        }
    </style>

</head>
<body>

    <h2 class="none-box">This text will not show (display:none)</h2>

    <h2 class="hidden-box">This text is hidden but space remains (visibility:hidden)</h2>

    <span class="inline-text">Inline Element 1</span>
    <span class="inline-text">Inline Element 2</span>

    <div class="block-box">This is a block element</div>

    <div class="inline-block-box">Box 1</div>
    <div class="inline-block-box">Box 2</div>

</body>
</html>
